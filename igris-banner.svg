<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090014"/>
      <stop offset="60%" stop-color="#120025"/>
      <stop offset="100%" stop-color="#1a0038"/>
    </linearGradient>

    <!-- Main aura glow -->
    <radialGradient id="aura" cx="50%" cy="48%" r="38%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#5425A8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#090014" stop-opacity="0"/>
    </radialGradient>

    <!-- Inner core glow -->
    <radialGradient id="core" cx="50%" cy="45%" r="18%">
      <stop offset="0%" stop-color="#36BCF7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090014" stop-opacity="0"/>
    </radialGradient>

    <!-- Sword blade gradient -->
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0D4FF"/>
      <stop offset="30%" stop-color="#C4B5FD"/>
      <stop offset="65%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#36BCF7"/>
    </linearGradient>

    <!-- Ground energy gradient -->
    <radialGradient id="ground" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#090014" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow filter -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- Strong glow for sword -->
    <filter id="swordGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Eye glow filter -->
    <filter id="eyeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Particle glow -->
    <filter id="particleGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <rect width="520" height="340" fill="url(#bg)"/>

  <!-- Subtle star field -->
  <circle cx="45" cy="30" r="0.6" fill="#C4B5FD" opacity="0.3"/>
  <circle cx="130" cy="18" r="0.4" fill="white" opacity="0.2"/>
  <circle cx="210" cy="42" r="0.5" fill="#C4B5FD" opacity="0.25"/>
  <circle cx="310" cy="15" r="0.4" fill="white" opacity="0.2"/>
  <circle cx="400" cy="35" r="0.6" fill="#C4B5FD" opacity="0.3"/>
  <circle cx="475" cy="22" r="0.5" fill="white" opacity="0.2"/>
  <circle cx="80" cy="55" r="0.4" fill="white" opacity="0.15"/>
  <circle cx="440" cy="58" r="0.4" fill="white" opacity="0.15"/>
  <circle cx="490" cy="85" r="0.5" fill="#C4B5FD" opacity="0.2"/>
  <circle cx="30" cy="90" r="0.5" fill="#C4B5FD" opacity="0.2"/>

  <!-- ============ ATMOSPHERIC GLOW ============ -->
  <ellipse cx="260" cy="165" rx="200" ry="155" fill="url(#aura)"/>
  <ellipse cx="260" cy="160" rx="110" ry="100" fill="url(#core)"/>

  <!-- Vertical energy beam behind figure -->
  <rect x="255" y="40" width="10" height="260" rx="5" fill="#8B5CF6" opacity="0.04" filter="url(#softGlow)"/>

  <!-- ============ KNIGHT FIGURE ============ -->
  <g transform="translate(260, 168)">

    <!-- Cape (flowing, wide) -->
    <path d="
      M -28,-52
      C -55,-20  -72,40  -68,105
      Q -65,120  -55,125
      L -20,110
      Q -5,105  0,108
      Q 5,105  20,110
      L 55,125
      Q 65,120  68,105
      C 72,40  55,-20  28,-52
      Z
    " fill="#0a0018" opacity="0.92"/>

    <!-- Cape inner highlight -->
    <path d="
      M -24,-48
      C -45,-15  -58,40  -55,100
      L -20,88
      Q 0,82  20,88
      L 55,100
      C 58,40  45,-15  24,-48
      Z
    " fill="#0f0022" opacity="0.6"/>

    <!-- Shoulders / pauldrons -->
    <path d="M -40,-42  L -52,-38  L -48,-28  L -32,-32  Z" fill="#0d001f"/>
    <path d="M  40,-42  L  52,-38  L  48,-28  L  32,-32  Z" fill="#0d001f"/>
    <!-- Shoulder edge glow -->
    <line x1="-52" y1="-38" x2="-40" y2="-42" stroke="#8B5CF6" stroke-width="0.8" opacity="0.4"/>
    <line x1="52" y1="-38" x2="40" y2="-42" stroke="#8B5CF6" stroke-width="0.8" opacity="0.4"/>

    <!-- Torso armor -->
    <path d="
      M -28,-42
      L -30,-15
      L -28,15
      L -22,45
      L -15,55
      L 0,58
      L 15,55
      L 22,45
      L 28,15
      L 30,-15
      L 28,-42
      Z
    " fill="#0b001c"/>

    <!-- Armor center line -->
    <line x1="0" y1="-40" x2="0" y2="55" stroke="#8B5CF6" stroke-width="0.6" opacity="0.2"/>

    <!-- Armor chest plates -->
    <path d="M -20,-35  L -24,-15  L -15,-5  L 0,-8  Z" fill="#0f0025" opacity="0.7"/>
    <path d="M  20,-35  L  24,-15  L  15,-5  L 0,-8  Z" fill="#0f0025" opacity="0.7"/>

    <!-- Waist belt -->
    <rect x="-24" y="30" width="48" height="5" rx="2" fill="#12002e"/>
    <rect x="-3" y="29" width="6" height="7" rx="1" fill="#8B5CF6" opacity="0.3"/>

    <!-- Legs -->
    <path d="M -15,55  L -18,80  L -20,105  L -14,108  L -10,80  L -5,58  Z" fill="#08001a"/>
    <path d="M  15,55  L  18,80  L  20,105  L  14,108  L  10,80  L  5,58  Z" fill="#08001a"/>

    <!-- Knee armor -->
    <ellipse cx="-16" cy="85" rx="5" ry="4" fill="#0d001f"/>
    <ellipse cx="16" cy="85" rx="5" ry="4" fill="#0d001f"/>

    <!-- Helmet -->
    <path d="
      M -16,-42
      L -20,-55
      L -18,-68
      L -14,-78
      L -8,-84
      L 0,-87
      L 8,-84
      L 14,-78
      L 18,-68
      L 20,-55
      L 16,-42
      Z
    " fill="#0b001c"/>

    <!-- Helmet crest / horn -->
    <path d="M 0,-87  L -3,-100  L 0,-96  L 3,-100  Z" fill="#12002e"/>

    <!-- Helmet visor slit -->
    <rect x="-12" y="-62" width="24" height="3" rx="1" fill="#050010"/>

    <!-- Helmet edge highlights -->
    <path d="M -16,-42  L -20,-55  L -18,-68" stroke="#8B5CF6" stroke-width="0.6" opacity="0.35" fill="none"/>
    <path d="M  16,-42  L  20,-55  L  18,-68" stroke="#8B5CF6" stroke-width="0.6" opacity="0.35" fill="none"/>

    <!-- ===== EYES (Glowing Purple) ===== -->
    <ellipse cx="-7" cy="-60" rx="3.5" ry="1.5" fill="#8B5CF6" filter="url(#eyeGlow)" opacity="0.9"/>
    <ellipse cx="7" cy="-60" rx="3.5" ry="1.5" fill="#8B5CF6" filter="url(#eyeGlow)" opacity="0.9"/>
    <!-- Eye bright centers -->
    <ellipse cx="-7" cy="-60" rx="1.5" ry="0.8" fill="#E0D4FF" opacity="0.8"/>
    <ellipse cx="7" cy="-60" rx="1.5" ry="0.8" fill="#E0D4FF" opacity="0.8"/>

    <!-- ===== SWORD (Glowing, held on right) ===== -->
    <g transform="translate(38, -20) rotate(8)">
      <!-- Sword glow aura -->
      <line x1="0" y1="-70" x2="0" y2="80" stroke="#8B5CF6" stroke-width="8" opacity="0.15" filter="url(#softGlow)"/>

      <!-- Blade -->
      <path d="
        M -2.5,-70
        L 0,-78
        L 2.5,-70
        L 3,80
        L -3,80
        Z
      " fill="url(#blade)" filter="url(#swordGlow)" opacity="0.9"/>

      <!-- Crossguard -->
      <rect x="-14" y="78" width="28" height="5" rx="2" fill="#C4B5FD" opacity="0.7" filter="url(#glow)"/>

      <!-- Handle -->
      <rect x="-2" y="83" width="4" height="18" rx="1" fill="#25104A"/>

      <!-- Pommel -->
      <circle cx="0" cy="103" r="4" fill="#25104A"/>
      <circle cx="0" cy="103" r="2" fill="#8B5CF6" opacity="0.5" filter="url(#glow)"/>
    </g>

    <!-- Hand holding sword -->
    <ellipse cx="32" cy="-10" rx="6" ry="5" fill="#0a0018"/>

  </g>

  <!-- ============ ENERGY PARTICLES ============ -->
  <!-- Floating energy motes around the figure -->
  <circle cx="145" cy="85" r="2.5" fill="#8B5CF6" opacity="0.65" filter="url(#particleGlow)"/>
  <circle cx="380" cy="95" r="2.0" fill="#36BCF7" opacity="0.55" filter="url(#particleGlow)"/>
  <circle cx="120" cy="195" r="1.5" fill="#C4B5FD" opacity="0.45" filter="url(#particleGlow)"/>
  <circle cx="400" cy="185" r="2.0" fill="#8B5CF6" opacity="0.50" filter="url(#particleGlow)"/>
  <circle cx="175" cy="55" r="1.5" fill="#36BCF7" opacity="0.40" filter="url(#particleGlow)"/>
  <circle cx="345" cy="65" r="1.8" fill="#C4B5FD" opacity="0.45" filter="url(#particleGlow)"/>
  <circle cx="105" cy="145" r="1.2" fill="#8B5CF6" opacity="0.35"/>
  <circle cx="415" cy="140" r="1.3" fill="#36BCF7" opacity="0.35"/>
  <circle cx="160" cy="265" r="1.8" fill="#8B5CF6" opacity="0.40" filter="url(#particleGlow)"/>
  <circle cx="365" cy="260" r="1.5" fill="#C4B5FD" opacity="0.40" filter="url(#particleGlow)"/>
  <circle cx="85" cy="240" r="1.0" fill="#36BCF7" opacity="0.30"/>
  <circle cx="435" cy="230" r="1.2" fill="#8B5CF6" opacity="0.30"/>
  <circle cx="195" cy="120" r="1.0" fill="#C4B5FD" opacity="0.3"/>
  <circle cx="330" cy="115" r="1.2" fill="#8B5CF6" opacity="0.3"/>

  <!-- Larger accent particles -->
  <circle cx="135" cy="160" r="3" fill="#8B5CF6" opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="390" cy="155" r="3" fill="#36BCF7" opacity="0.10" filter="url(#softGlow)"/>

  <!-- ============ GROUND ENERGY ============ -->
  <ellipse cx="260" cy="290" rx="100" ry="12" fill="url(#ground)" filter="url(#softGlow)"/>

  <!-- Ground energy wisps -->
  <path d="M 200,288 Q 230,275 260,288 Q 290,275 320,288" stroke="#8B5CF6" stroke-width="1" fill="none" opacity="0.15" filter="url(#glow)"/>
  <path d="M 180,292 Q 220,280 260,292 Q 300,280 340,292" stroke="#36BCF7" stroke-width="0.8" fill="none" opacity="0.10" filter="url(#glow)"/>

  <!-- Subtle vignette edges -->
  <rect width="520" height="340" fill="none" stroke="#090014" stroke-width="40" opacity="0.3"/>
</svg>
