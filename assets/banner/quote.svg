<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 110" width="100%" height="110">
  <defs>
    <linearGradient id="quote-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="quote-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="quote-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Container Box with Rounded Corners and Subtle Accent Border -->
  <rect x="2" y="2" width="1096" height="106" rx="14" fill="url(#quote-bg)" stroke="url(#quote-border)" stroke-width="1.5"/>

  <!-- Left Quotation Mark -->
  <text x="50" y="65" font-family="Georgia, serif" font-size="56" font-weight="bold" fill="url(#quote-glow)" opacity="0.85">“</text>

  <!-- Quote Body -->
  <text x="550" y="58" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="20" font-style="italic" font-weight="500" fill="#f8fafc" text-anchor="middle" letter-spacing="0.3">
    You were given a mind capable of changing the world. Make sure the world is better because you existed.
  </text>

  <!-- Right Quotation Mark -->
  <text x="1050" y="78" font-family="Georgia, serif" font-size="56" font-weight="bold" fill="url(#quote-glow)" opacity="0.85">”</text>
</svg>